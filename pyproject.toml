[project]
name = "ml-infra-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "awktatters", email = "srinidhi.812@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "torch>=2.15.0",
]

[project.scripts]
ml-infra-foundations = "foundations:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "foundations"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = [
    "smoke: quick sanity checks that the environment works",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
